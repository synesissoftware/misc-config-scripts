name: CI

on:
  push:
    branches:
    - master
    - dev
    - boilerplate
    - idiomatic
    - rc1
    - rc2
    - rc3
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checking out code
      uses: actions/checkout@v4

    - name: Shell syntax
      run: bash -n unix/.commonrc
